name: Test Workflow
run-name: Checking test run
description: This workflow demonstrates all workflow_dispatch input types.

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # STRING
      # ============================================================
      test_suite:
        description: "Specify the test suite to run"
        required: true
        default: "all"
        type: string

      # ============================================================
      # CHOICE
      # ============================================================
      test_type:
        description: "Select the type of test to run"
        required: true
        default: "unit"
        type: choice
        options:
          - unit
          - integration
          - ui
          - performance

      # ============================================================
      # BOOLEAN
      # ============================================================
      run_tests:
        description: "Should tests be executed?"
        required: true
        default: true
        type: boolean

      # ============================================================
      # ENVIRONMENT
      # ============================================================
      environment:
        description: "Select the deployment/testing environment"
        required: true
        type: environment

      # ============================================================
      # NUMBER
      # ============================================================
      retry_count:
        description: "Number of times tests should be retried"
        required: false
        default: "3"
        type: number

      # ============================================================
      # OPTIONAL STRING
      # ============================================================
      test_filter:
        description: "Optional pytest filter"
        required: false
        default: ""
        type: string

      # ============================================================
      # OPTIONAL CHOICE
      # ============================================================
      log_level:
        description: "Select logging level"
        required: true
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warning
          - error

      # ============================================================
      # OPTIONAL BOOLEAN
      # ============================================================
      generate_report:
        description: "Generate a test report?"
        required: false
        default: false
        type: boolean

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Display inputs
        run: |
          echo "======================================"
          echo "Workflow Inputs"
          echo "======================================"

          echo "Test Suite      : ${{ inputs.test_suite }}"
          echo "Test Type       : ${{ inputs.test_type }}"
          echo "Run Tests       : ${{ inputs.run_tests }}"
          echo "Environment     : ${{ inputs.environment }}"
          echo "Retry Count     : ${{ inputs.retry_count }}"
          echo "Test Filter     : ${{ inputs.test_filter }}"
          echo "Log Level       : ${{ inputs.log_level }}"
          echo "Generate Report : ${{ inputs.generate_report }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: |
          if [ "${{ inputs.test_suite }}" == "all" ]; then
            pytest tests/
          else
            pytest tests/${{ inputs.test_suite }}
          fi